<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamer Utility Suite</title>
    <style>
        /* Базовые стили и сброс настроек под мобильные экраны */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0813;
            color: #f1edff;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Переменные кастомизации (будут меняться через JS) */
        :root {
            --main-color: #8b5cf6;
            --main-glow: rgba(139, 92, 246, 0.4);
            --bg-glass: rgba(25, 18, 44, 0.6);
            --border-radius: 16px;
            --blur-strength: 12px;
        }

        /* Задний фон с неоновыми размытыми кругами */
        .bg-glow-1 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--main-color);
            filter: blur(120px);
            opacity: 0.2;
            top: -50px;
            left: -50px;
            z-index: -1;
        }

        .bg-glow-2 {
            position: fixed;
            width: 250px;
            height: 250px;
            background: #ec4899;
            filter: blur(100px);
            opacity: 0.15;
            bottom: 100px;
            right: -50px;
            z-index: -1;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(11, 8, 19, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px var(--main-glow);
        }

        /* Контейнер вкладок */
        .container {
            padding: 16px;
            display: none;
        }

        .container.active {
            display: block;
        }

        /* Стеклянные панели (Glassmorphism) */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 14px;
            color: #c4b5fd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        /* Элементы форм */
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(25, 18, 44, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--main-glow);
        }

        /* Ползунки */
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            margin: 10px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--main-color);
            box-shadow: 0 0 8px var(--main-glow);
            cursor: pointer;
        }

        /* Кнопки */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--main-color);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 14px var(--main-glow);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Результаты и вывод текста */
        .output-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            color: #a7f3d0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        /* Сетка превью для конструктора */
        .preview-widget {
            background: var(--bg-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            padding: 16px;
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            margin-bottom: 16px;
            text-align: center;
        }

        .preview-btn {
            background: var(--main-color);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--main-glow);
            margin-top: 8px;
        }

        /* Нижнее меню навигации */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(15, 11, 28, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--main-color);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <header>
        <h1 id="app-title">Gamer Suite</h1>
    </header>

    <!-- ВКЛАДКА 1: ОПТИМИЗАЦИЯ MINECRAFT -->
    <div id="tab-optimizer" class="container active">
        <div class="glass-card">
            <h2>⚙️ Параметры смартфона</h2>
            
            <label>Общий объем ОЗУ (RAM) телефона:</label>
            <select id="ram-select">
                <option value="4">4 ГБ</option>
                <option value="6" selected>6 ГБ</option>
                <option value="8">8 ГБ</option>
                <option value="12">12 ГБ</option>
            </select>

            <label>Тип процессора (Чипсет):</label>
            <select id="cpu-select">
                <option value="low">Бюджетный (MediaTek Helio / Snapdragon 4-6 серии)</option>
                <option value="mid" selected>Средний класс (Snapdragon 7 серии / Helio G99 / Dimensity)</option>
                <option value="high">Флагман (Snapdragon 8 серии / Dimensity 9000+)</option>
            </select>

            <label>Основная проблема:</label>
            <select id="issue-select">
                <option value="fps">Низкий FPS и фризы</option>
                <option value="heat">Телефон дико греется и сбрасывает яркость</option>
                <option value="crash">Игра вылетает через 10-15 минут</option>
            </select>
            
            <button class="btn" onclick="generateConfig()">Рассчитать оптимизацию</button>
        </div>

        <div class="glass-card" id="result-card" style="display: none;">
            <h2>📋 Рекомендации и Настройки</h2>
            
            <label>Выделение памяти для лаунчера (аргумент):</label>
            <div class="output-box" id="ram-argument"></div>
            
            <label>Рекомендуемые технические моды (Fabric 1.21.4):</label>
            <div class="output-box" id="mods-list"></div>

            <label>Сгенерированный файл настроек (options.txt):</label>
            <div class="output-box" id="options-txt"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: КОНСТРУКТОР ДИЗАЙНА -->
    <div id="tab-designer" class="container">
        <!-- Интерактивное превью -->
        <div class="preview-widget" id="preview-box">
            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af;">Превью интерфейса</span>
            <h3 style="margin: 10px 0 5px 0; font-size: 18px;">Заголовок Окна</h3>
            <p style="font-size: 13px; opacity: 0.7; margin-bottom: 10px;">Пример обычного текста в приложении.</p>
            <div class="preview-btn" id="preview-btn-element">Кнопка</div>
        </div>

        <div class="glass-card">
            <h2>🎨 Настройка UI стилей</h2>

            <label>Основной неоновый цвет:</label>
            <select id="ui-color-select" onchange="updateLiveTheme()">
                <option value="#8b5cf6" selected>Фиолетовый (Default Neon)</option>
                <option value="#3b82f6">Синий (Cyber Dynamic)</option>
                <option value="#10b981">Зеленый (Matrix Hack)</option>
                <option value="#ec4899">Розовый (Tokyo Acid)</option>
                <option value="#f59e0b">Янтарный (Gold Edition)</option>
            </select>

            <label>Прозрачность панелей (Glassmorphism):</label>
            <input type="range" id="ui-alpha-range" min="10" max="90" value="60" oninput="updateLiveTheme()">

            <label>Размытие заднего фона (Blur):</label>
            <input type="range" id="ui-blur-range" min="0" max="25" value="12" oninput="updateLiveTheme()">

            <label>Скругление углов кнопок и карточек:</label>
            <input type="range" id="ui-radius-range" min="0" max="30" value="16" oninput="updateLiveTheme()">

            <button class="btn" onclick="exportThemeJson()">Экспортировать тему в .JSON</button>
            <div class="output-box" id="theme-output" style="display: none;"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav>
        <div class="nav-item active" id="nav-opt" onclick="switchTab('optimizer')">
            <svg viewBox="0 0 24 24">
                <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
            Оптимизация
        </div>
        <div class="nav-item" id="nav-des" onclick="switchTab('designer')">
            <svg viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
            Дизайнер UI
        </div>
    </nav>

    <script>
        // Переключение между вкладками приложения
        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(tabId === 'optimizer') {
                document.getElementById('tab-optimizer').classList.add('active');
                document.getElementById('nav-opt').classList.add('active');
                document.getElementById('app-title').innerText = "Minecraft Optimizer";
            } else {
                document.getElementById('tab-designer').classList.add('active');
                document.getElementById('nav-des').classList.add('active');
                document.getElementById('app-title').innerText = "UI Theme Designer";
            }
        }

        // ЛОГИКА 1: Калькулятор оптимизации под мобильный Minecraft
        function generateConfig() {
            const ram = parseInt(document.getElementById('ram-select').value);
            const cpu = document.getElementById('cpu-select').value;
            const issue = document.getElementById('issue-select').value;

            // Расчет выделения оперативной памяти
            let allocatedRam = 2048; 
            if (ram === 4) allocatedRam = 1800;
            if (ram === 6) allocatedRam = 3000;
            if (ram === 8) allocatedRam = 4500;
            if (ram === 12) allocatedRam = 7000;

            const ramArg = `-Xmx${allocatedRam}M -Xms${allocatedRam}M -XX:+UseG1GC -XX:G1ReservePercent=20 -XX:G1HeapRegionSize=32m`;
            document.getElementById('ram-argument').innerText = ramArg;

            // Выбор пакета модов под железо
            let mods = "1. Fabric API (базовый слой)\n2. Sodium (основа FPS)";
            if (cpu === 'low' || issue === 'fps') {
                mods += "\n3. Lithium (оптимизация физики мира)\n4. FerriteCore (резкое снижение потребления ОЗУ)\n5. Vulcan / Krypton (оптимизация сетевых пакетов и рендера цепочек)";
            } else if (cpu === 'mid') {
                mods += "\n3. Lithium\n4. FerriteCore\n5. ImmediatelyFast (ускорение рендера шрифтов и частиц)";
            } else {
                mods += "\n3. Lithium\n4. Iris Shaders (для шейдеров без просадки кадров)\n5. ModernFix (ускорение загрузки тяжелых сборок)";
            }
            document.getElementById('mods-list').innerText = mods;

            // Генерация кастомного options.txt
            let renderDistance = 6;
            let shadowDistance = 4;
            let particles = "2"; // 2 - минимальные
            let maxFps = "120";

            if (cpu === 'low') { renderDistance = 4; maxFps = "60"; }
            if (cpu === 'high') { renderDistance = 12; shadowDistance = 10; particles = "0"; maxFps = "0"; } // 0 - неограничено
            if (issue === 'heat') { maxFps = "60"; renderDistance = Math.min(renderDistance, 7); }

            const optionsTxt = `version:3953\nrenderDistance:${renderDistance}\nsimulationDistance:6\nmaxFps:${maxFps}\ngraphicsMode:0\nao:0\nbobView:false\nsoundCategory_master:1.0\nparticles:${particles}\nenableVsync:false\nshadowRadius:${shadowDistance}\nmiptarget:0\nclouds:false`;
            
            document.getElementById('options-txt').innerText = optionsTxt;
            document.getElementById('result-card').style.display = 'block';
        }

        // ЛОГИКА 2: Живой интерактивный кастомизатор стилей темы
        function updateLiveTheme() {
            const mainColor = document.getElementById('ui-color-select').value;
            const alpha = document.getElementById('ui-alpha-range').value;
            const blur = document.getElementById('ui-blur-range').value;
            const radius = document.getElementById('ui-radius-range').value;

            // Преобразование HEX в RGBA для эффекта стекла
            const r = parseInt(mainColor.slice(1, 3), 16);
            const g = parseInt(mainColor.slice(3, 5), 16);
            const b = parseInt(mainColor.slice(5, 7), 16);
            
            const mainGlow = `rgba(${r}, ${g}, ${b}, 0.4)`;
            const bgGlass = `rgba(${Math.round(r*0.15)}, ${Math.round(g*0.15)}, ${Math.round(b*0.2)}, ${alpha / 100})`;

            // Применение стилей к :root документу в реальном времени
            document.documentElement.style.setProperty('--main-color', mainColor);
            document.documentElement.style.setProperty('--main-glow', mainGlow);
            document.documentElement.style.setProperty('--bg-glass', bgGlass);
            document.documentElement.style.setProperty('--border-radius', radius + 'px');
            document.documentElement.style.setProperty('--blur-strength', blur + 'px');

            // Обновляем превью-элементы отдельно для наглядности
            const previewBtn = document.getElementById('preview-btn-element');
            previewBtn.style.borderRadius = (radius * 0.6) + 'px';
        }

        // Экспорт сгенерированного конфига темы в JSON формат
        function exportThemeJson() {
            const theme = {
                theme_name: "Custom Telegram WebApp Premium",
                primary_color: document.documentElement.style.getPropertyValue('--main-color') || "#8b5cf6",
                glow_effect: document.documentElement.style.getPropertyValue('--main-glow') || "rgba(139, 92, 246, 0.4)",
                glass_background: document.documentElement.style.getPropertyValue('--bg-glass') || "rgba(25, 18, 44, 0.6)",
                border_radius: document.documentElement.style.getPropertyValue('--border-radius') || "16px",
                backdrop_blur: document.documentElement.style.getPropertyValue('--blur-strength') || "12px",
                author_platform: "Mobile WebApp Engine"
            };

            const out = document.getElementById('theme-output');
            out.innerText = JSON.stringify(theme, null, 4);
            out.style.display = 'block';
        }
    </script>
</body>
              </html>
